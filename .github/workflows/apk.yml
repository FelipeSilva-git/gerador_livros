# Gera o APK do app Android a cada envio para a branch main.
# O APK fica em Releases -> "App Android (mais recente)".
name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Copiar a tela para o projeto Android
        run: npm run android:sync

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk Livrinhos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Livrinhos-apk
          path: Livrinhos.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: App Android (mais recente)
          body: |
            Versão ${{ github.run_number }} do app Livrinhos para Android.
            Baixe o arquivo **Livrinhos.apk** no celular e toque nele para instalar.
            Pode instalar por cima da versão anterior: os livros guardados no celular continuam.
          files: Livrinhos.apk
          make_latest: true
